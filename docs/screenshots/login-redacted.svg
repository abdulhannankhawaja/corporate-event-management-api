<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title description">
  <title id="title">Login response with access token redacted</title>
  <desc id="description">POST /auth/login returned 200. Credentials and access token are not included.</desc>
  <rect width="720" height="180" rx="12" fill="#f3f6fa"/>
  <rect width="720" height="48" rx="12" fill="#26364a"/>
  <text x="24" y="32" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">POST /auth/login</text>
  <rect x="24" y="68" width="68" height="30" rx="6" fill="#16803c"/>
  <text x="42" y="89" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">200</text>
  <text x="108" y="89" fill="#26364a" font-family="Arial, sans-serif" font-size="17">Bearer token issued</text>
  <text x="24" y="137" fill="#526173" font-family="Arial, sans-serif" font-size="15">Credentials and access token redacted.</text>
</svg>
