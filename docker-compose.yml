# Docker Compose configuration for the local PostgreSQL database.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: event_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_db"]
      interval: 5s
      timeout: 5s
      retries: 5

# Keep database data across container recreation.
volumes:
  postgres_data:
